server:
  port: 8080

spring:
  application:
    name: quickflow
  datasource:
    url: jdbc:h2:file:./data/quickflow;AUTO_SERVER=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Milestones may land out of numeric order (M03's V3 before M02's V2); see DECISIONS A-04.
    out-of-order: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Zone used for "today", "overdue", "this week" (D-04). Empty = server system zone.
  zone: ""
