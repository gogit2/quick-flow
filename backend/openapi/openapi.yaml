openapi: 3.1.0
info:
  title: QuickFlow API
  description: "Single-user productivity API: tasks, habits, learning resources, todo\
    \ plans, dashboard, settings."
  version: v1
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Tasks
  description: "Tasks: CRUD, complete, archive/restore, search and filters (FR-01,\
    \ FR-02)"
- name: Habits
  description: "Recurring habits and their completions (FR-03, FR-04)"
- name: Learning
  description: "Learning cards with milestones and notes (FR-05, FR-06)"
paths:
  /api/v1/tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Get a task
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
    put:
      tags:
      - Tasks
      summary: Update a task
      description: Setting status to DONE sets `completedAt`; leaving DONE clears
        it.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
        required: true
      responses:
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
    delete:
      tags:
      - Tasks
      summary: Delete a task
      description: Hard delete (BR-14).
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Task not found
  /api/v1/learning-cards/{id}:
    get:
      tags:
      - Learning
      summary: Get a learning card
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Card not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
    put:
      tags:
      - Learning
      summary: Update a learning card
      description: Replaces title and description. An optional `status` sets it manually
        (D-31).
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningCardRequest"
        required: true
      responses:
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "404":
          description: Card not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
    delete:
      tags:
      - Learning
      summary: Delete a learning card
      description: Hard delete; its milestones and notes too (D-32).
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Card not found
  /api/v1/learning-cards/{id}/milestones/{milestoneId}:
    put:
      tags:
      - Learning
      summary: Update a milestone
      description: Replaces title and targetDate; optional `done` marks it. Returns
        the updated card.
      operationId: updateMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneRequest"
        required: true
      responses:
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "404":
          description: "Card not found, or milestone not on this card"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
    delete:
      tags:
      - Learning
      summary: Remove a milestone
      description: The card status is re-derived.
      operationId: removeMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Removed
        "404":
          description: "Card not found, or milestone not on this card"
  /api/v1/habits/{id}:
    get:
      tags:
      - Habits
      summary: Get a habit
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Habit not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitResponse"
    put:
      tags:
      - Habits
      summary: Update a habit
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitRequest"
        required: true
      responses:
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "404":
          description: Habit not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitResponse"
    delete:
      tags:
      - Habits
      summary: Delete a habit
      description: Hard delete; its completions are deleted too (D-25).
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Habit not found
  /api/v1/tasks:
    get:
      tags:
      - Tasks
      summary: List and search tasks
      description: "Filters combine with AND. Archived tasks are excluded unless `archived=true`\
        \ (which lists only archived ones). Sort by `createdAt` (default, newest first)\
        \ or `dueDate` (default ascending); tasks without a due date always sort last."
      operationId: list
      parameters:
      - name: q
        in: query
        description: Case-insensitive substring of the title
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - name: dueDate
        in: query
        description: Exact due date
        required: false
        schema:
          type: string
          format: date
      - name: dueFrom
        in: query
        description: Due on or after this date
        required: false
        schema:
          type: string
          format: date
      - name: dueTo
        in: query
        description: Due on or before this date
        required: false
        schema:
          type: string
          format: date
      - name: archived
        in: query
        description: "false (default) = active tasks, true = archived tasks only"
        required: false
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - createdAt
          - dueDate
      - name: dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        "400":
          description: "Invalid filter, sort or dir"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
    post:
      tags:
      - Tasks
      summary: Create a task
      description: "Status defaults to TODO, priority to MEDIUM."
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/v1/tasks/{id}/restore:
    post:
      tags:
      - Tasks
      summary: Restore an archived task
      operationId: restore
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/v1/tasks/{id}/complete:
    post:
      tags:
      - Tasks
      summary: Complete a task
      description: Sets status DONE and `completedAt`.
      operationId: complete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/v1/tasks/{id}/archive:
    post:
      tags:
      - Tasks
      summary: Archive a task
      description: Hidden from the default list; see `archived=true`.
      operationId: archive
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/v1/learning-cards:
    get:
      tags:
      - Learning
      summary: List learning cards
      description: "All cards by id, each with milestones and notes."
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningCardResponse"
    post:
      tags:
      - Learning
      summary: Create a learning card
      description: Starts NOT_STARTED; `status` in the body is ignored.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningCardRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
  /api/v1/learning-cards/{id}/notes:
    post:
      tags:
      - Learning
      summary: Add a note
      operationId: addNote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
        required: true
      responses:
        "201":
          description: Added
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "404":
          description: Card not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NoteResponse"
  /api/v1/learning-cards/{id}/milestones:
    post:
      tags:
      - Learning
      summary: Add a milestone
      description: Appended last. Returns the updated card (status re-derived).
      operationId: addMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneRequest"
        required: true
      responses:
        "201":
          description: Added; body is the updated card
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "404":
          description: Card not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
  /api/v1/learning-cards/{id}/milestones/{milestoneId}/uncomplete:
    post:
      tags:
      - Learning
      summary: Un-complete a milestone
      description: Clears `completedAt`. Returns the updated card.
      operationId: uncompleteMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: "Card not found, or milestone not on this card"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
  /api/v1/learning-cards/{id}/milestones/{milestoneId}/complete:
    post:
      tags:
      - Learning
      summary: Complete a milestone
      description: Sets `completedAt`. Returns the updated card.
      operationId: completeMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: "Card not found, or milestone not on this card"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
  /api/v1/habits:
    get:
      tags:
      - Habits
      summary: List habits
      description: All habits by id; filter with `active`.
      operationId: list_2
      parameters:
      - name: active
        in: query
        description: "true = active only, false = deactivated only, omitted = all"
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitResponse"
    post:
      tags:
      - Habits
      summary: Create a habit
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitResponse"
  /api/v1/habits/{id}/deactivate:
    post:
      tags:
      - Habits
      summary: Deactivate a habit
      description: Hidden from today's lists but kept.
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitResponse"
  /api/v1/habits/{id}/completions:
    get:
      tags:
      - Habits
      summary: List a habit's completions
      description: Newest first.
      operationId: completions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Habit not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompletionResponse"
    post:
      tags:
      - Habits
      summary: Complete a habit
      description: "For today, or for `date` (not in the future)."
      operationId: complete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "201":
          description: Completion recorded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionResponse"
        "400":
          description: Date in the future
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionResponse"
        "404":
          description: Habit not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionResponse"
        "409":
          description: Already completed on that date
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /api/v1/habits/{id}/activate:
    post:
      tags:
      - Habits
      summary: Activate a habit
      operationId: activate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitResponse"
  /api/v1/learning-cards/{id}/notes/{noteId}:
    delete:
      tags:
      - Learning
      summary: Remove a note
      operationId: removeNote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: noteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Removed
        "404":
          description: "Card not found, or note not on this card"
  /api/v1/habits/{id}/completions/{date}:
    delete:
      tags:
      - Habits
      summary: Remove a completion on a date
      operationId: uncomplete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        "204":
          description: Removed
        "404":
          description: "Habit not found, or not completed on that date"
  /api/v1/habits/{id}/completions/today:
    delete:
      tags:
      - Habits
      summary: Un-complete a habit for today
      operationId: uncompleteToday
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Removed
        "404":
          description: "Habit not found, or not completed today"
components:
  schemas:
    TaskRequest:
      type: object
      description: Create or update a task
      properties:
        title:
          type: string
          example: Write the report
          maxLength: 200
          minLength: 0
        description:
          type: string
          example: Quarterly numbers
          maxLength: 2000
          minLength: 0
        status:
          type: string
          description: "Create: defaults to TODO. Update: omitted keeps the current\
            \ status"
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
          example: TODO
        priority:
          type: string
          description: "Create: defaults to MEDIUM. Update: omitted keeps the current\
            \ priority"
          enum:
          - LOW
          - MEDIUM
          - HIGH
          example: HIGH
        dueDate:
          type: string
          format: date
          description: "Optional due date. On update, omitted/null clears it"
          example: 2026-09-30
      required:
      - title
    TaskResponse:
      type: object
      description: A task with its computed overdue flag
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Write the report
        description:
          type: string
          example: Quarterly numbers
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
          example: TODO
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          example: HIGH
        dueDate:
          type: string
          format: date
          example: 2026-09-30
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        completedAt:
          type: string
          format: date-time
          description: Set while status is DONE
          example: 2026-09-26T16:00:00Z
        archived:
          type: boolean
          example: false
        overdue:
          type: boolean
          description: "dueDate is before today, status is not DONE, and the task\
            \ is not archived"
          example: false
    LearningCardRequest:
      type: object
      description: Create or update a learning card
      properties:
        title:
          type: string
          example: Spring Boot in Action
          maxLength: 200
          minLength: 0
        description:
          type: string
          description: "Description or source (link, book, course name)"
          example: https://example.com/course
          maxLength: 2000
          minLength: 0
        status:
          type: string
          description: Manual status override (update only; ignored on create). Omit
            to keep the current status. A later milestone change re-derives it.
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          example: IN_PROGRESS
      required:
      - title
    LearningCardResponse:
      type: object
      description: "A learning card with its milestones, notes and computed progress"
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Spring Boot in Action
        description:
          type: string
          example: https://example.com/course
        status:
          type: string
          description: Derived from milestones (D-31) unless set manually since the
            last milestone change
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          example: IN_PROGRESS
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        milestones:
          type: array
          description: In display order
          items:
            $ref: "#/components/schemas/MilestoneResponse"
        notes:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/NoteResponse"
        milestonesTotal:
          type: integer
          format: int32
          example: 2
        milestonesDone:
          type: integer
          format: int32
          example: 1
        progressPercent:
          type: integer
          format: int32
          description: "milestonesDone ÷ milestonesTotal, 0–100; 0 when there are\
            \ no milestones"
          example: 50
    MilestoneResponse:
      type: object
      description: A milestone of a learning card
      properties:
        id:
          type: integer
          format: int64
          example: 3
        cardId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Finish chapter 1
        done:
          type: boolean
          example: false
        targetDate:
          type: string
          format: date
          example: 2026-10-15
        completedAt:
          type: string
          format: date-time
          description: Set while done (D-30)
          example: 2026-09-26T15:00:00Z
        position:
          type: integer
          format: int32
          description: "Display order within the card, 0-based"
          example: 0
    NoteResponse:
      type: object
      description: A note on a learning card
      properties:
        id:
          type: integer
          format: int64
          example: 5
        cardId:
          type: integer
          format: int64
          example: 1
        text:
          type: string
          example: Chapter 3 explains auto-configuration well
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
    MilestoneRequest:
      type: object
      description: Add or update a milestone of a learning card
      properties:
        title:
          type: string
          example: Finish chapter 1
          maxLength: 200
          minLength: 0
        targetDate:
          type: string
          format: date
          description: Optional target date; null clears it on update
          example: 2026-10-15
        done:
          type: boolean
          description: "Update only: mark done/not done. Omit to keep. Ignored on\
            \ create."
          example: true
      required:
      - title
    HabitRequest:
      type: object
      description: Create or update a habit
      properties:
        name:
          type: string
          example: Read 20 pages
          maxLength: 150
          minLength: 0
        description:
          type: string
          example: Before bed
          maxLength: 1000
          minLength: 0
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          example: DAILY
      required:
      - frequency
      - name
    HabitResponse:
      type: object
      description: A habit with its computed progress fields
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Read 20 pages
        description:
          type: string
          example: Before bed
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          example: DAILY
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        doneToday:
          type: boolean
          description: A completion exists for today (any frequency)
          example: true
        doneThisPeriod:
          type: boolean
          description: "Daily: done today. Weekly: at least one completion in the\
            \ current ISO week"
          example: true
        currentStreak:
          type: integer
          format: int32
          description: "Consecutive days (daily) or ISO weeks (weekly) completed,\
            \ ending now or in the previous period"
          example: 3
        progressPercent:
          type: integer
          format: int32
          description: "Daily: completed days in the last 7 ÷ 7. Weekly: completed\
            \ weeks in the last 4 ÷ 4. 0–100"
          example: 43
        lastCompletedDate:
          type: string
          format: date
          example: 2026-09-26
    NoteRequest:
      type: object
      description: Add a note to a learning card
      properties:
        text:
          type: string
          example: Chapter 3 explains auto-configuration well
          maxLength: 5000
          minLength: 0
      required:
      - text
    CompletionRequest:
      type: object
      description: Optional completion body. Omit it (or `date`) to complete for today.
      properties:
        date:
          type: string
          format: date
          description: Completion date in the app zone; not in the future
          example: 2026-09-25
    CompletionResponse:
      type: object
      description: One habit completion
      properties:
        id:
          type: integer
          format: int64
          example: 10
        habitId:
          type: integer
          format: int64
          example: 1
        date:
          type: string
          format: date
          example: 2026-09-26
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
