openapi: 3.1.0
info:
  title: QuickFlow API
  description: "Single-user productivity API: tasks, habits, learning resources, todo\
    \ plans, dashboard, settings."
  version: v1
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Tasks
  description: "Tasks: CRUD, complete, archive/restore, search and filters (FR-01,\
    \ FR-02)"
- name: Dashboard
  description: "Summary of tasks, habits, plans and learning (FR-09)"
- name: Settings
  description: Single-user application preferences (D-51)
- name: Habits
  description: "Recurring habits and their completions (FR-03, FR-04)"
- name: Plans
  description: "Todo plans built from tasks, habits and learning cards (FR-07, FR-08)"
- name: Learning
  description: "Learning cards with milestones and notes (FR-05, FR-06)"
paths:
  /api/v1/tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Get a task
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          description: Task not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - Tasks
      summary: Update a task
      description: Setting status to DONE sets `completedAt`; leaving DONE clears
        it.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Task not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Tasks
      summary: Delete a task
      description: Hard delete (BR-14).
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Task not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/settings:
    get:
      tags:
      - Settings
      summary: Get the settings
      description: "Defaults: displayName Friend, notificationsEnabled true, browserNotifications\
        \ false, defaultView DASHBOARD."
      operationId: get_1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    put:
      tags:
      - Settings
      summary: Update the settings
      description: displayName is required (max 100). Omitted flags or defaultView
        keep their value (A-10).
      operationId: update_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/plans/{id}:
    get:
      tags:
      - Plans
      summary: Get a plan
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "404":
          description: Plan not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - Plans
      summary: Update a plan
      description: Replaces every field and the item list; kept sources keep their
        done flag. Status is recomputed.
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Validation or business rule failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Plan not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Plans
      summary: Delete a plan
      description: Hard delete of the plan and its items; sources are untouched.
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Plan not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/learning-cards/{id}:
    get:
      tags:
      - Learning
      summary: Get a learning card
      operationId: get_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "404":
          description: Card not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - Learning
      summary: Update a learning card
      description: Replaces title and description. An optional `status` sets it manually
        (D-31).
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningCardRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Card not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Learning
      summary: Delete a learning card
      description: Hard delete; its milestones and notes too (D-32).
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Card not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/learning-cards/{id}/milestones/{milestoneId}:
    put:
      tags:
      - Learning
      summary: Update a milestone
      description: Replaces title and targetDate; optional `done` marks it. Returns
        the updated card.
      operationId: updateMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Card not found, or milestone not on this card"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Learning
      summary: Remove a milestone
      description: The card status is re-derived.
      operationId: removeMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Removed
        "404":
          description: "Card not found, or milestone not on this card"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/habits/{id}:
    get:
      tags:
      - Habits
      summary: Get a habit
      operationId: get_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "404":
          description: Habit not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - Habits
      summary: Update a habit
      operationId: update_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Habit not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Habits
      summary: Delete a habit
      description: Hard delete; its completions are deleted too (D-25).
      operationId: delete_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Habit not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/tasks:
    get:
      tags:
      - Tasks
      summary: List and search tasks
      description: "Filters combine with AND. Archived tasks are excluded unless `archived=true`\
        \ (which lists only archived ones). Sort by `createdAt` (default, newest first)\
        \ or `dueDate` (default ascending); tasks without a due date always sort last."
      operationId: list
      parameters:
      - name: q
        in: query
        description: Case-insensitive substring of the title
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - name: dueDate
        in: query
        description: Exact due date
        required: false
        schema:
          type: string
          format: date
      - name: dueFrom
        in: query
        description: Due on or after this date
        required: false
        schema:
          type: string
          format: date
      - name: dueTo
        in: query
        description: Due on or before this date
        required: false
        schema:
          type: string
          format: date
      - name: archived
        in: query
        description: "false (default) = active tasks, true = archived tasks only"
        required: false
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - createdAt
          - dueDate
      - name: dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
        "400":
          description: "Invalid filter, sort or dir"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - Tasks
      summary: Create a task
      description: "Status defaults to TODO, priority to MEDIUM."
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/tasks/{id}/restore:
    post:
      tags:
      - Tasks
      summary: Restore an archived task
      operationId: restore
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          description: Task not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/tasks/{id}/complete:
    post:
      tags:
      - Tasks
      summary: Complete a task
      description: Sets status DONE and `completedAt`.
      operationId: complete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          description: Task not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/tasks/{id}/archive:
    post:
      tags:
      - Tasks
      summary: Archive a task
      description: Hidden from the default list; see `archived=true`.
      operationId: archive
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          description: Task not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/plans:
    get:
      tags:
      - Plans
      summary: List plans
      description: "Sorted IN_PROGRESS, NOT_STARTED, COMPLETED; then priorityOrder\
        \ (1 first), then start (D-41)."
      operationId: list_1
      parameters:
      - name: status
        in: query
        description: Only plans with this derived status
        required: false
        schema:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Invalid status filter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - Plans
      summary: Create a plan
      description: "Needs ≥ 1 item referencing existing sources, no duplicates, end\
        \ after start (BR-10, BR-11, D-42)."
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Validation or business rule failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/learning-cards:
    get:
      tags:
      - Learning
      summary: List learning cards
      description: "All cards by id, each with milestones and notes."
      operationId: list_2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningCardResponse"
    post:
      tags:
      - Learning
      summary: Create a learning card
      description: Starts NOT_STARTED; `status` in the body is ignored.
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningCardRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/learning-cards/{id}/notes:
    post:
      tags:
      - Learning
      summary: Add a note
      operationId: addNote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
        required: true
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Card not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/learning-cards/{id}/milestones:
    post:
      tags:
      - Learning
      summary: Add a milestone
      description: Appended last. Returns the updated card (status re-derived).
      operationId: addMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneRequest"
        required: true
      responses:
        "201":
          description: Added; body is the updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Card not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/learning-cards/{id}/milestones/{milestoneId}/uncomplete:
    post:
      tags:
      - Learning
      summary: Un-complete a milestone
      description: Clears `completedAt`. Returns the updated card.
      operationId: uncompleteMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "404":
          description: "Card not found, or milestone not on this card"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/learning-cards/{id}/milestones/{milestoneId}/complete:
    post:
      tags:
      - Learning
      summary: Complete a milestone
      description: Sets `completedAt`. Returns the updated card.
      operationId: completeMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCardResponse"
        "404":
          description: "Card not found, or milestone not on this card"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/habits:
    get:
      tags:
      - Habits
      summary: List habits
      description: All habits by id; filter with `active`.
      operationId: list_3
      parameters:
      - name: active
        in: query
        description: "true = active only, false = deactivated only, omitted = all"
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitResponse"
    post:
      tags:
      - Habits
      summary: Create a habit
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/habits/{id}/deactivate:
    post:
      tags:
      - Habits
      summary: Deactivate a habit
      description: Hidden from today's lists but kept.
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "404":
          description: Habit not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/habits/{id}/completions:
    get:
      tags:
      - Habits
      summary: List a habit's completions
      description: Newest first.
      operationId: completions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompletionResponse"
        "404":
          description: Habit not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - Habits
      summary: Complete a habit
      description: "For today, or for `date` (not in the future)."
      operationId: complete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "201":
          description: Completion recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
        "400":
          description: Date in the future
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Habit not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Already completed on that date
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/habits/{id}/activate:
    post:
      tags:
      - Habits
      summary: Activate a habit
      operationId: activate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "404":
          description: Habit not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/plans/{id}/items/{itemId}:
    patch:
      tags:
      - Plans
      summary: Mark a plan item done or not done
      description: "Returns the whole plan with recomputed progress and status (FR-08).\
        \ Done: task → DONE, habit → completion for today (existing one ignored),\
        \ learning → no change. Un-marking never reverts the source (BR-13, D-47)."
      operationId: setItemDone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanItemDoneRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Missing done flag
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Plan or item not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/plans/history:
    get:
      tags:
      - Plans
      summary: Plan history
      description: "COMPLETED plans (derived status), most recent endDateTime first,\
        \ with final progress (D-49)."
      operationId: history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanResponse"
  /api/v1/dashboard:
    get:
      tags:
      - Dashboard
      summary: Get the dashboard
      description: "One payload with every widget (D-50): greeting, today's/overdue/completed-today\
        \ tasks, task completion %, today's habits, active and upcoming plans, learning\
        \ snapshot. Computed at request time, so plan item changes show immediately\
        \ (FR-08)."
      operationId: get_5
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /api/v1/learning-cards/{id}/notes/{noteId}:
    delete:
      tags:
      - Learning
      summary: Remove a note
      operationId: removeNote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: noteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Removed
        "404":
          description: "Card not found, or note not on this card"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/habits/{id}/completions/{date}:
    delete:
      tags:
      - Habits
      summary: Remove a completion on a date
      operationId: uncomplete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        "204":
          description: Removed
        "404":
          description: "Habit not found, or not completed on that date"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/habits/{id}/completions/today:
    delete:
      tags:
      - Habits
      summary: Un-complete a habit for today
      operationId: uncompleteToday
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Removed
        "404":
          description: "Habit not found, or not completed today"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    TaskRequest:
      type: object
      description: Create or update a task
      properties:
        title:
          type: string
          example: Write the report
          maxLength: 200
          minLength: 0
        description:
          type: string
          example: Quarterly numbers
          maxLength: 2000
          minLength: 0
        status:
          type: string
          description: "Create: defaults to TODO. Update: omitted keeps the current\
            \ status"
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
          example: TODO
        priority:
          type: string
          description: "Create: defaults to MEDIUM. Update: omitted keeps the current\
            \ priority"
          enum:
          - LOW
          - MEDIUM
          - HIGH
          example: HIGH
        dueDate:
          type: string
          format: date
          description: "Optional due date. On update, omitted/null clears it"
          example: 2026-09-30
      required:
      - title
    TaskResponse:
      type: object
      description: A task with its computed overdue flag
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Write the report
        description:
          type: string
          example: Quarterly numbers
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
          example: TODO
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          example: HIGH
        dueDate:
          type: string
          format: date
          example: 2026-09-30
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        completedAt:
          type: string
          format: date-time
          description: Set while status is DONE
          example: 2026-09-26T16:00:00Z
        archived:
          type: boolean
          example: false
        overdue:
          type: boolean
          description: "dueDate is before today, status is not DONE, and the task\
            \ is not archived"
          example: false
    SettingsRequest:
      type: object
      description: Update the settings. Omitted flags or defaultView keep their current
        value (A-10)
      properties:
        displayName:
          type: string
          example: Ahmed
          maxLength: 100
          minLength: 0
        notificationsEnabled:
          type: boolean
          example: true
        browserNotifications:
          type: boolean
          example: false
        defaultView:
          type: string
          enum:
          - DASHBOARD
          - TASKS
          - HABITS
          - LEARNING
          - PLANS
          - SETTINGS
          example: DASHBOARD
      required:
      - displayName
    SettingsResponse:
      type: object
      description: Application settings (D-51)
      properties:
        displayName:
          type: string
          description: Used in the dashboard greeting
          example: Friend
        notificationsEnabled:
          type: boolean
          example: true
        browserNotifications:
          type: boolean
          example: false
        defaultView:
          type: string
          description: Page opened at app start
          enum:
          - DASHBOARD
          - TASKS
          - HABITS
          - LEARNING
          - PLANS
          - SETTINGS
          example: DASHBOARD
    PlanItemRequest:
      type: object
      description: "A plan item: an existing task, habit or learning card"
      properties:
        sourceType:
          type: string
          enum:
          - TASK
          - HABIT
          - LEARNING_RESOURCE
          example: TASK
        sourceId:
          type: integer
          format: int64
          description: "Id of the task, habit or learning card"
          example: 1
      required:
      - sourceId
      - sourceType
    PlanRequest:
      type: object
      description: "Create or update (full replace) a plan. On update, items whose\
        \ source is kept keep their done flag."
      properties:
        title:
          type: string
          example: Morning focus block
          maxLength: 200
          minLength: 0
        estimatedDuration:
          type: integer
          format: int32
          description: Estimated duration in minutes (D-40); informational
          example: 60
          minimum: 1
        startDateTime:
          type: string
          format: date-time
          example: 2026-09-26T08:00:00Z
        endDateTime:
          type: string
          format: date-time
          description: Must be after startDateTime (BR-11)
          example: 2026-09-26T09:00:00Z
        priorityOrder:
          type: integer
          format: int32
          description: 1 = highest priority (D-41); need not be unique
          example: 1
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItemRequest"
          minItems: 1
      required:
      - endDateTime
      - estimatedDuration
      - items
      - priorityOrder
      - startDateTime
      - title
    PlanItemResponse:
      type: object
      description: A plan item with its source's current title and status (D-48)
      properties:
        id:
          type: integer
          format: int64
          example: 10
        sourceType:
          type: string
          enum:
          - TASK
          - HABIT
          - LEARNING_RESOURCE
          example: TASK
        sourceId:
          type: integer
          format: int64
          example: 1
        sourceTitle:
          type: string
          description: "Task title, habit name or learning card title"
          example: Write report
        sourceStatus:
          type: string
          description: "TASK: TODO|IN_PROGRESS|DONE. LEARNING_RESOURCE: NOT_STARTED|IN_PROGRESS|COMPLETED.\
            \ HABIT: DONE|PENDING|INACTIVE for the current period (A-08)"
          example: TODO
        done:
          type: boolean
          example: false
        position:
          type: integer
          format: int32
          description: 0-based display order
          example: 0
    PlanResponse:
      type: object
      description: "A plan with its items and values computed at serverTime (D-43,\
        \ D-44)"
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Morning focus block
        estimatedDuration:
          type: integer
          format: int32
          description: Minutes
          example: 60
        startDateTime:
          type: string
          format: date-time
          example: 2026-09-26T08:00:00Z
        endDateTime:
          type: string
          format: date-time
          example: 2026-09-26T09:00:00Z
        priorityOrder:
          type: integer
          format: int32
          description: 1 = highest
          example: 1
        status:
          type: string
          description: "Derived: COMPLETED if all items done or now ≥ end; IN_PROGRESS\
            \ if start ≤ now < end; else NOT_STARTED"
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          example: IN_PROGRESS
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T07:30:00Z
        items:
          type: array
          description: In display order
          items:
            $ref: "#/components/schemas/PlanItemResponse"
        doneItems:
          type: integer
          format: int32
          example: 1
        totalItems:
          type: integer
          format: int32
          example: 3
        progressPercent:
          type: integer
          format: int32
          description: "doneItems ÷ totalItems, 0–100; 0 when there are no items"
          example: 33
        remainingSeconds:
          type: integer
          format: int64
          description: "Seconds until endDateTime while IN_PROGRESS, else null (BR-12)"
          example: 1800
        startsInSeconds:
          type: integer
          format: int64
          description: "Seconds until startDateTime while NOT_STARTED, else null (A-01)"
          example: 600
        serverTime:
          type: string
          format: date-time
          description: Server clock when computed; use it to correct client clock
            skew
          example: 2026-09-26T08:30:00Z
    LearningCardRequest:
      type: object
      description: Create or update a learning card
      properties:
        title:
          type: string
          example: Spring Boot in Action
          maxLength: 200
          minLength: 0
        description:
          type: string
          description: "Description or source (link, book, course name)"
          example: https://example.com/course
          maxLength: 2000
          minLength: 0
        status:
          type: string
          description: Manual status override (update only; ignored on create). Omit
            to keep the current status. A later milestone change re-derives it.
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          example: IN_PROGRESS
      required:
      - title
    LearningCardResponse:
      type: object
      description: "A learning card with its milestones, notes and computed progress"
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Spring Boot in Action
        description:
          type: string
          example: https://example.com/course
        status:
          type: string
          description: Derived from milestones (D-31) unless set manually since the
            last milestone change
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          example: IN_PROGRESS
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        milestones:
          type: array
          description: In display order
          items:
            $ref: "#/components/schemas/MilestoneResponse"
        notes:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/NoteResponse"
        milestonesTotal:
          type: integer
          format: int32
          example: 2
        milestonesDone:
          type: integer
          format: int32
          example: 1
        progressPercent:
          type: integer
          format: int32
          description: "milestonesDone ÷ milestonesTotal, 0–100; 0 when there are\
            \ no milestones"
          example: 50
    MilestoneResponse:
      type: object
      description: A milestone of a learning card
      properties:
        id:
          type: integer
          format: int64
          example: 3
        cardId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Finish chapter 1
        done:
          type: boolean
          example: false
        targetDate:
          type: string
          format: date
          example: 2026-10-15
        completedAt:
          type: string
          format: date-time
          description: Set while done (D-30)
          example: 2026-09-26T15:00:00Z
        position:
          type: integer
          format: int32
          description: "Display order within the card, 0-based"
          example: 0
    NoteResponse:
      type: object
      description: A note on a learning card
      properties:
        id:
          type: integer
          format: int64
          example: 5
        cardId:
          type: integer
          format: int64
          example: 1
        text:
          type: string
          example: Chapter 3 explains auto-configuration well
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
    MilestoneRequest:
      type: object
      description: Add or update a milestone of a learning card
      properties:
        title:
          type: string
          example: Finish chapter 1
          maxLength: 200
          minLength: 0
        targetDate:
          type: string
          format: date
          description: Optional target date; null clears it on update
          example: 2026-10-15
        done:
          type: boolean
          description: "Update only: mark done/not done. Omit to keep. Ignored on\
            \ create."
          example: true
      required:
      - title
    HabitRequest:
      type: object
      description: Create or update a habit
      properties:
        name:
          type: string
          example: Read 20 pages
          maxLength: 150
          minLength: 0
        description:
          type: string
          example: Before bed
          maxLength: 1000
          minLength: 0
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          example: DAILY
      required:
      - frequency
      - name
    HabitResponse:
      type: object
      description: A habit with its computed progress fields
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Read 20 pages
        description:
          type: string
          example: Before bed
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          example: DAILY
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
        doneToday:
          type: boolean
          description: A completion exists for today (any frequency)
          example: true
        doneThisPeriod:
          type: boolean
          description: "Daily: done today. Weekly: at least one completion in the\
            \ current ISO week"
          example: true
        currentStreak:
          type: integer
          format: int32
          description: "Consecutive days (daily) or ISO weeks (weekly) completed,\
            \ ending now or in the previous period"
          example: 3
        progressPercent:
          type: integer
          format: int32
          description: "Daily: completed days in the last 7 ÷ 7. Weekly: completed\
            \ weeks in the last 4 ÷ 4. 0–100"
          example: 43
        lastCompletedDate:
          type: string
          format: date
          example: 2026-09-26
    NoteRequest:
      type: object
      description: Add a note to a learning card
      properties:
        text:
          type: string
          example: Chapter 3 explains auto-configuration well
          maxLength: 5000
          minLength: 0
      required:
      - text
    CompletionRequest:
      type: object
      description: Optional completion body. Omit it (or `date`) to complete for today.
      properties:
        date:
          type: string
          format: date
          description: Completion date in the app zone; not in the future
          example: 2026-09-25
    CompletionResponse:
      type: object
      description: One habit completion
      properties:
        id:
          type: integer
          format: int64
          example: 10
        habitId:
          type: integer
          format: int64
          example: 1
        date:
          type: string
          format: date
          example: 2026-09-26
        createdAt:
          type: string
          format: date-time
          example: 2026-09-26T15:00:00Z
    PlanItemDoneRequest:
      type: object
      description: Mark a plan item done or not done
      properties:
        done:
          type: boolean
          description: "true = done (applies the BR-13 side effect), false = not done\
            \ (source is not reverted)"
          example: true
      required:
      - done
    DashboardCard:
      type: object
      description: A learning card summary
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Spring Boot in Action
        milestonesDone:
          type: integer
          format: int32
          example: 1
        milestonesTotal:
          type: integer
          format: int32
          example: 2
        progressPercent:
          type: integer
          format: int32
          example: 50
    DashboardHabits:
      type: object
      description: Habit widgets
      properties:
        today:
          type: array
          description: Active daily habits plus active weekly habits not done this
            week (D-24)
          items:
            $ref: "#/components/schemas/HabitResponse"
        activeCount:
          type: integer
          format: int32
          description: Active habits
          example: 4
        completedTodayCount:
          type: integer
          format: int32
          description: Active habits with a completion today
          example: 2
    DashboardLearning:
      type: object
      description: Learning snapshot
      properties:
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: Number of cards per status; every status is present
          example:
            NOT_STARTED: 2
            IN_PROGRESS: 1
            COMPLETED: 0
        inProgress:
          type: array
          description: "IN_PROGRESS cards, by id"
          items:
            $ref: "#/components/schemas/DashboardCard"
        milestonesCompletedLast7Days:
          type: integer
          format: int32
          description: Milestones marked done in the last 7 days (D-30)
          example: 3
    DashboardPlans:
      type: object
      description: Plan widgets
      properties:
        active:
          type: array
          description: IN_PROGRESS plans with progress and remainingSeconds (BR-12)
          items:
            $ref: "#/components/schemas/PlanResponse"
        upcoming:
          type: array
          description: Next NOT_STARTED plans by startDateTime (max 5)
          items:
            $ref: "#/components/schemas/PlanResponse"
        activeCount:
          type: integer
          format: int32
          example: 1
    DashboardResponse:
      type: object
      description: "Every dashboard widget, computed from live data at serverTime\
        \ (FR-09, D-50)"
      properties:
        greeting:
          type: string
          description: "\"Good morning/afternoon/evening, {displayName}\" in the app\
            \ zone (D-52, A-02)"
          example: "Good morning, Friend"
        displayName:
          type: string
          description: From settings
          example: Friend
        serverTime:
          type: string
          format: date-time
          example: 2026-09-26T08:30:00Z
        today:
          type: string
          format: date
          description: Today in the app zone
          example: 2026-09-26
        tasks:
          $ref: "#/components/schemas/DashboardTasks"
        habits:
          $ref: "#/components/schemas/DashboardHabits"
        plans:
          $ref: "#/components/schemas/DashboardPlans"
        learning:
          $ref: "#/components/schemas/DashboardLearning"
    DashboardTasks:
      type: object
      description: Task widgets. Archived tasks are ignored everywhere
      properties:
        dueToday:
          type: array
          description: "dueDate = today, any status, by id"
          items:
            $ref: "#/components/schemas/TaskResponse"
        overdue:
          type: array
          description: "Overdue tasks (D-12), by dueDate"
          items:
            $ref: "#/components/schemas/TaskResponse"
        completedToday:
          type: array
          description: "DONE with completedAt today, newest first"
          items:
            $ref: "#/components/schemas/TaskResponse"
        totalActive:
          type: integer
          format: int32
          description: All non-archived tasks
          example: 8
        doneCount:
          type: integer
          format: int32
          description: Non-archived DONE tasks
          example: 3
        completionPercent:
          type: integer
          format: int32
          description: "doneCount ÷ totalActive, rounded, 0–100; 0 when there are\
            \ no tasks (D-15)"
          example: 38
    ProblemDetail:
      type: object
      description: RFC 7807 error body (D-05)
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: One or more fields are invalid
        instance:
          type: string
          example: /api/v1/tasks
        errors:
          type: object
          additionalProperties:
            type: string
          description: Field name → message; present on validation and business-rule
            errors
          example: "{title=Title is required}"
